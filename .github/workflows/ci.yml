name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  duplication:
    uses: ahmedavais/karkhana/.github/workflows/duplication.yml@main

  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx streamdeck validate com.ahmedavais.toolkit.sdPlugin

  failed-update-alarm:
    needs: [duplication, verify]
    if: failure()
    permissions:
      pull-requests: write
    uses: ahmedavais/karkhana/.github/workflows/failed-update-alarm.yml@main
